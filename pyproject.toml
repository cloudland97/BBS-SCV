# Tooling config for the BBS-SCV telegram admin bot.
# Mirrors the sibling BBS repo's ruff/pytest conventions.

[tool.ruff]
line-length = 100
exclude = [".venv", "__pycache__", "site-packages", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: line-too-long — not enforced (long f-strings / PowerShell command blocks)
# E402: module-level-import-not-at-top — circular-import avoidance uses late imports
# E741: ambiguous variable name (l/O/I) — occurs in terse loop bodies
ignore = ["E501", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]  # sys.path bootstrap must run before source imports

[tool.pytest.ini_options]
testpaths = ["tests"]
