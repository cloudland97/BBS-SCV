repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        verbose: true
        args: [--exit-zero]  # warn only, don't block commit
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
  # Local gate. Runs on push, not on every commit, so committing stays fast
  # while nothing reaches the public repo untested. This matters more than
  # usual right now: GitHub Actions is disabled account-wide, so CI is not
  # running on pushes and this is the only automated check left.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: python scripts/run_tests.py
        language: system
        pass_filenames: false
        stages: [pre-push]
