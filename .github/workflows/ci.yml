name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install ruff~=0.15 pytest~=9.0 -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests (pytest)
        run: pytest -q
